<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In | MarketLink – eGreen Basket</title>

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="bg-cream">

  <header class="py-4 bg-white border-bottom border-subtle">
    <div class="container text-center">
      <a class="navbar-brand justify-content-center" href="../index.html">
        <div class="brand-icon"><i class="bi bi-flower1"></i></div>
        <div>
          <span class="brand-title">MarketLink</span>
          <span class="brand-subtitle text-danger">Master Administrator Console</span>
        </div>
      </a>
    </div>
  </header>

  <section class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="card p-4 p-md-5 rounded-32 border-subtle shadow-md bg-white">
            <div class="text-center mb-4">
              <div class="rounded-circle bg-danger-subtle text-danger p-3 d-inline-flex align-items-center justify-content-center mb-2" style="width:64px; height:64px;">
                <i class="bi bi-shield-lock-fill fs-3"></i>
              </div>
              <h3 class="font-serif text-forest mb-1">Market Coordinator Admin</h3>
              <p class="text-muted small">Platform moderation, market registry, and farmer approvals.</p>
            </div>

            <form onsubmit="event.preventDefault(); showToast('Welcome Administrator!', 'success'); setTimeout(() => window.location.href='dashboard.html', 700);">
              <div class="mb-3">
                <label class="form-label small fw-bold">Admin Email</label>
                <input type="email" class="form-control rounded-12" value="admin@marketlink.org" required>
              </div>

              <div class="mb-4">
                <label class="form-label small fw-bold">Master Password</label>
                <input type="password" class="form-control rounded-12" value="••••••••" required>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-forest rounded-pill py-3 fw-bold">
                  <i class="bi bi-shield-check me-1"></i> Sign In to Admin Console
                </button>
              </div>

              <div class="text-center">
                <a href="../index.html" class="small text-forest text-decoration-none">
                  <i class="bi bi-arrow-left me-1"></i> Return to Public Marketplace
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="marketlink-footer py-4">
    <div class="container text-center">
      <p class="mb-1 text-white-50">&copy; 2026 MarketLink – Connecting local farmers with local communities.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
