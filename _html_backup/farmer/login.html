<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Sign In | MarketLink – eGreen Basket</title>

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="bg-cream">

  <header class="py-4 bg-white border-bottom border-subtle">
    <div class="container text-center">
      <a class="navbar-brand justify-content-center" href="../index.html">
        <div class="brand-icon"><i class="bi bi-flower1"></i></div>
        <div>
          <span class="brand-title">MarketLink</span>
          <span class="brand-subtitle">Farmer Vendor Portal</span>
        </div>
      </a>
    </div>
  </header>

  <section class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
          <div class="card p-4 p-md-5 rounded-32 border-subtle shadow-md bg-white">
            <div class="text-center mb-4">
              <div class="rounded-circle bg-sage p-3 text-forest d-inline-flex align-items-center justify-content-center mb-2" style="width:64px; height:64px;">
                <i class="bi bi-shop fs-3"></i>
              </div>
              <h3 class="font-serif text-forest mb-1">Farmer Stall Login</h3>
              <p class="text-muted small">Manage your weekly stock, review customer pre-orders, and configure market pickup windows.</p>
            </div>

            <form onsubmit="event.preventDefault(); showToast('Signing in to Farmer Portal...', 'success'); setTimeout(() => window.location.href='dashboard.html', 700);">
              <div class="mb-3">
                <label class="form-label small fw-bold">Farmer Email</label>
                <input type="email" class="form-control rounded-12" value="farmer.vance@marketlink.org" required>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" class="form-control rounded-12" value="••••••••" required>
              </div>

              <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="farmerRemember" checked>
                  <label class="form-check-label small text-muted" for="farmerRemember">Remember me</label>
                </div>
                <a href="../pages/forgot-password.html" class="small text-forest text-decoration-none">Forgot?</a>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-forest rounded-pill py-3 fw-bold">
                  <i class="bi bi-box-arrow-in-right me-1"></i> Access Farmer Dashboard
                </button>
              </div>

              <div class="text-center">
                <span class="small text-muted">New grower? </span>
                <a href="register.html" class="small text-forest fw-bold text-decoration-none">Apply for Vendor Stall</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="marketlink-footer py-4">
    <div class="container text-center">
      <p class="mb-1 text-white-50">&copy; 2026 MarketLink – Connecting local farmers with local communities.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
